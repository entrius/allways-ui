name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set image tag and API base URL
        id: build
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=entrius/aw-ui:latest" >> $GITHUB_OUTPUT
            echo "api_base_url=https://api.all-ways.io" >> $GITHUB_OUTPUT
          else
            echo "tags=entrius/aw-ui:test" >> $GITHUB_OUTPUT
            echo "api_base_url=https://test-api.all-ways.io" >> $GITHUB_OUTPUT
          fi

      - name: Create .env file
        run: echo "VITE_REACT_APP_BASE_URL=${{ steps.build.outputs.api_base_url }}" > .env

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.build.outputs.tags }}

      # Env is explicit in every ping — TEST rolls to the isaiah box via watchtower.
      - name: Notify Discord (success)
        if: success()
        run: |
          ENV_LABEL="${{ github.ref == 'refs/heads/main' && 'PROD (aw-ui:latest)' || 'TEST — isaiah box (aw-ui:test)' }}"
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" -H "Content-Type: application/json" \
            -d "{\"content\": \"🖥️ **allways-ui** image pushed · **${ENV_LABEL}** · \`${GITHUB_SHA::7}\` — watchtower deploys within ~3 min.\"}"

      - name: Notify Discord (failure)
        if: failure()
        run: |
          ENV_LABEL="${{ github.ref == 'refs/heads/main' && 'PROD' || 'TEST — isaiah box' }}"
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" -H "Content-Type: application/json" \
            -d "{\"content\": \"💀 **allways-ui** image build FAILED · **${ENV_LABEL}** · \`${GITHUB_SHA::7}\` — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
