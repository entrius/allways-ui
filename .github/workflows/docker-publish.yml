name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set image tag and API base URL
        id: build
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=entrius/aw-ui:latest" >> $GITHUB_OUTPUT
            echo "api_base_url=https://api.all-ways.io" >> $GITHUB_OUTPUT
          else
            echo "tags=entrius/aw-ui:test" >> $GITHUB_OUTPUT
            echo "api_base_url=https://test-api.all-ways.io" >> $GITHUB_OUTPUT
          fi

      - name: Create .env file
        run: echo "VITE_REACT_APP_BASE_URL=${{ steps.build.outputs.api_base_url }}" > .env

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.build.outputs.tags }}

      # for notifying of image publish or failure (same pattern as das deploy.yml).
      # Success pings TEST only — prod deploys are announced by release.yml's promotion ping.
      - name: Notify Publish Failure
        if: failure()
        run: curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" -d "content=💩 UI image build failed on ${{ github.ref == 'refs/heads/main' && 'PROD' || 'TEST (isaiah)' }} environment"

      - name: Discord Success Post
        if: success() && github.ref != 'refs/heads/main'
        run: curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" -d "content=🚀 UI image pushed on TEST (isaiah) environment — watchtower deploys in ~3 min"
